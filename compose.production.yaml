# Standalone file: do not merge with compose.yaml, which publishes PostgreSQL.
name: fako-production

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    networks: [database]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/app.Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with postgres as hostname}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      TTS_PROVIDER: ${TTS_PROVIDER:-disabled}
      AUDIO_API_TOKEN: ${AUDIO_API_TOKEN:-}
      AUDIO_STORAGE_ROOT: /app/storage/audio
      # RijPermis connector, quiz-video pipeline and social features: same trust boundary/token as
      # local dev (see apps/api/.env.example) — the API never needs OpenAI/ElevenLabs/platform
      # app secrets, only whether each feature is switched on and the shared admin Bearer token.
      RIJPERMIS_API_ENABLED: ${RIJPERMIS_API_ENABLED:-false}
      RIJPERMIS_API_BASE_URL: ${RIJPERMIS_API_BASE_URL:-}
      RIJPERMIS_API_KEY: ${RIJPERMIS_API_KEY:-}
      RIJPERMIS_MOCK_MODE: ${RIJPERMIS_MOCK_MODE:-false}
      RIJPERMIS_MEDIA_ROOT: /app/storage/rijpermis-images
      QUIZ_VIDEO_ENABLED: ${QUIZ_VIDEO_ENABLED:-false}
      QUIZ_VIDEO_API_TOKEN: ${QUIZ_VIDEO_API_TOKEN:?Set QUIZ_VIDEO_API_TOKEN (shared admin Bearer token, 32+ chars)}
      QUIZ_VIDEO_STORAGE_ROOT: /app/storage/quiz-videos
      SOCIAL_ACCOUNTS_ENABLED: ${SOCIAL_ACCOUNTS_ENABLED:-false}
      SOCIAL_MOCK_MODE: ${SOCIAL_MOCK_MODE:-false}
      SOCIAL_TOKEN_ENCRYPTION_KEY: ${SOCIAL_TOKEN_ENCRYPTION_KEY:-}
      SOCIAL_TOKEN_ENCRYPTION_KEY_PREVIOUS: ${SOCIAL_TOKEN_ENCRYPTION_KEY_PREVIOUS:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      SOCIAL_PUBLISHING_ENABLED: ${SOCIAL_PUBLISHING_ENABLED:-false}
    volumes:
      - audio_data:/app/storage/audio:ro
      - quiz_video_data:/app/storage/quiz-videos:ro
      - rijpermis_media_data:/app/storage/rijpermis-images
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    networks: [database, application]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/app.Dockerfile
      target: worker-runtime
    command: ["node", "apps/worker/dist/worker.js"]
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      TTS_PROVIDER: ${TTS_PROVIDER:-disabled}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      AUDIO_STORAGE_ROOT: /app/storage/audio
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-45000}
      OPENAI_PRICE_MODEL: ${OPENAI_PRICE_MODEL:-}
      OPENAI_INPUT_USD_PER_MILLION: ${OPENAI_INPUT_USD_PER_MILLION:-}
      OPENAI_OUTPUT_USD_PER_MILLION: ${OPENAI_OUTPUT_USD_PER_MILLION:-}
      OPENAI_CACHED_INPUT_USD_PER_MILLION: ${OPENAI_CACHED_INPUT_USD_PER_MILLION:-}
      RIJPERMIS_API_ENABLED: ${RIJPERMIS_API_ENABLED:-false}
      RIJPERMIS_API_BASE_URL: ${RIJPERMIS_API_BASE_URL:-}
      RIJPERMIS_API_KEY: ${RIJPERMIS_API_KEY:-}
      RIJPERMIS_MOCK_MODE: ${RIJPERMIS_MOCK_MODE:-false}
      RIJPERMIS_MEDIA_ROOT: /app/storage/rijpermis-images
      QUIZ_VIDEO_ENABLED: ${QUIZ_VIDEO_ENABLED:-false}
      QUIZ_VIDEO_TTS_PROVIDER: ${QUIZ_VIDEO_TTS_PROVIDER:-disabled}
      QUIZ_VIDEO_STORAGE_ROOT: /app/storage/quiz-videos
      QUIZ_VIDEO_AUDIO_CACHE_ROOT: /app/storage/audio-cache
      # Bounds how many videos the worker renders in *parallel* (jobs), independent of
      # QUIZ_VIDEO_RENDER_CONCURRENCY below (threads/tabs *within* a single render) — see
      # packages/media-engine/src/render.ts. Both default to 1: safe for a modest VPS, raise only
      # after actually measuring headroom (see infrastructure/docker/README.md's render benchmark).
      QUIZ_VIDEO_WORKER_CONCURRENCY: ${QUIZ_VIDEO_WORKER_CONCURRENCY:-1}
      QUIZ_VIDEO_RENDER_CONCURRENCY: ${QUIZ_VIDEO_RENDER_CONCURRENCY:-1}
      SOCIAL_MOCK_MODE: ${SOCIAL_MOCK_MODE:-false}
      SOCIAL_TOKEN_ENCRYPTION_KEY: ${SOCIAL_TOKEN_ENCRYPTION_KEY:-}
      SOCIAL_TOKEN_ENCRYPTION_KEY_PREVIOUS: ${SOCIAL_TOKEN_ENCRYPTION_KEY_PREVIOUS:-}
      SOCIAL_PUBLISHING_ENABLED: ${SOCIAL_PUBLISHING_ENABLED:-false}
      SOCIAL_PUBLISHING_WORKER_CONCURRENCY: ${SOCIAL_PUBLISHING_WORKER_CONCURRENCY:-1}
      SOCIAL_PUBLISHING_RECONCILE_INTERVAL_MS: ${SOCIAL_PUBLISHING_RECONCILE_INTERVAL_MS:-60000}
      SOCIAL_PUBLISHING_RECONCILE_GRACE_MS: ${SOCIAL_PUBLISHING_RECONCILE_GRACE_MS:-900000}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_APP_AUDITED: ${TIKTOK_APP_AUDITED:-false}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      INSTAGRAM_APP_AUDITED: ${INSTAGRAM_APP_AUDITED:-false}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_APP_AUDITED: ${FACEBOOK_APP_AUDITED:-false}
      # Mission 15 section 4 — see docs/social-publishing.md. Must be the same public origin the
      # `proxy` service below terminates HTTPS for ($ADMIN_DOMAIN); absent (the default) hard-blocks
      # Instagram publication with a clear reason instead of a confusing remote failure.
      PUBLIC_VIDEO_BASE_URL: ${PUBLIC_VIDEO_BASE_URL:-}
      PUBLIC_VIDEO_LINK_TTL_MS: ${PUBLIC_VIDEO_LINK_TTL_MS:-7200000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - audio_data:/app/storage/audio
      - quiz_video_data:/app/storage/quiz-videos
      - rijpermis_media_data:/app/storage/rijpermis-images
    networks: [database, application]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Mission 15 section 3: previously absent from this file entirely — the quiz-video generation
  # schedule (mission 11) and the social-publication due-date sweep (mission 14) only ever ran from a
  # developer's own machine. Both are DB-only/HTTP-client processes (never render, never touch
  # Redis/BullMQ directly), so they reuse the lean `runtime` target, not `worker-runtime`.
  scheduler-generation:
    build:
      context: .
      dockerfile: infrastructure/docker/app.Dockerfile
      target: runtime
    command: ["node", "apps/scheduler/dist/scheduler.js"]
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      SCHEDULER_PROJECT_SLUG: ${SCHEDULER_PROJECT_SLUG:-rijpermis}
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-Europe/Brussels}
      SCHEDULER_SLOTS: ${SCHEDULER_SLOTS:-09:00,16:00,21:00}
      SCHEDULER_GRACE_MINUTES: ${SCHEDULER_GRACE_MINUTES:-120}
      SCHEDULER_MAX_PENDING_JOBS: ${SCHEDULER_MAX_PENDING_JOBS:-10}
      SCHEDULER_TICK_INTERVAL_MS: ${SCHEDULER_TICK_INTERVAL_MS:-60000}
      RIJPERMIS_API_ENABLED: ${RIJPERMIS_API_ENABLED:-false}
      RIJPERMIS_API_BASE_URL: ${RIJPERMIS_API_BASE_URL:-}
      RIJPERMIS_API_KEY: ${RIJPERMIS_API_KEY:-}
      RIJPERMIS_MOCK_MODE: ${RIJPERMIS_MOCK_MODE:-false}
      RIJPERMIS_MEDIA_ROOT: /app/storage/rijpermis-images
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - rijpermis_media_data:/app/storage/rijpermis-images
    networks: [database, application]
    depends_on:
      postgres:
        condition: service_healthy

  scheduler-publication:
    build:
      context: .
      dockerfile: infrastructure/docker/app.Dockerfile
      target: runtime
    command: ["node", "apps/scheduler/dist/social-publication-scheduler.js"]
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      SOCIAL_PUBLISHING_ENABLED: ${SOCIAL_PUBLISHING_ENABLED:-false}
      SOCIAL_PUBLISHING_MAX_IN_FLIGHT: ${SOCIAL_PUBLISHING_MAX_IN_FLIGHT:-20}
      SOCIAL_PUBLISHING_SCHEDULER_TICK_INTERVAL_MS: ${SOCIAL_PUBLISHING_SCHEDULER_TICK_INTERVAL_MS:-30000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks: [database, application]
    depends_on:
      postgres:
        condition: service_healthy

  # Mission 15 section 3/5: the admin interface (mission 12) was never containerized either — it only
  # ever talks to `api` over HTTP (never to PostgreSQL/Redis directly), so it only joins `application`.
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/app.Dockerfile
      target: web-runtime
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3100
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH (npm run hash-password --workspace=@fako/web)}
      ADMIN_SESSION_KEY: ${ADMIN_SESSION_KEY:?Set ADMIN_SESSION_KEY (32 bytes hex)}
      ADMIN_API_BASE_URL: http://api:3000
      QUIZ_VIDEO_API_TOKEN: ${QUIZ_VIDEO_API_TOKEN:?Set QUIZ_VIDEO_API_TOKEN (same value as the api service)}
      ADMIN_PROJECT_SLUG: ${ADMIN_PROJECT_SLUG:-rijpermis}
      # Must be the real public domain (same as $ADMIN_DOMAIN below) — used only to build the exact
      # OAuth redirect URI registered with TikTok/Meta, never derived from a request header.
      ADMIN_PUBLIC_BASE_URL: ${ADMIN_PUBLIC_BASE_URL:?Set ADMIN_PUBLIC_BASE_URL to https://ADMIN_DOMAIN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks: [application]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Prepared only — not started by default (see infrastructure/docker/README.md). Caddy terminates
  # HTTPS for $ADMIN_DOMAIN with an automatic Let's Encrypt certificate once DNS actually points here;
  # routes the one public path (/public/quiz-video-links/*) to `api`, everything else to `web`.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN to the real public hostname before starting this service}
    volumes:
      - ./infrastructure/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    networks: [application]
    depends_on:
      - web
      - api

  migrate:
    profiles: [tools]
    build:
      context: .
      dockerfile: infrastructure/docker/app.Dockerfile
      target: migration
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with postgres as hostname}
      SOCIAL_TOKEN_ENCRYPTION_KEY: ${SOCIAL_TOKEN_ENCRYPTION_KEY:-}
      SOCIAL_TOKEN_ENCRYPTION_KEY_PREVIOUS: ${SOCIAL_TOKEN_ENCRYPTION_KEY_PREVIOUS:-}
      QUIZ_VIDEO_STORAGE_ROOT: /app/storage/quiz-videos
      QUIZ_VIDEO_RETENTION_DAYS: ${QUIZ_VIDEO_RETENTION_DAYS:-90}
    volumes:
      # Mounted here too (not just api/worker): the one-off key-rotation and video-retention scripts
      # (db:reencrypt-social-tokens, db:prune-old-quiz-videos) only ever run through this image, since
      # `runtime`'s pruned node_modules drops tsx. See infrastructure/docker/README.md.
      - quiz_video_data:/app/storage/quiz-videos
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy

networks:
  database:
    internal: true
  application:

volumes:
  postgres_data:
  redis_data:
  audio_data:
  quiz_video_data:
  rijpermis_media_data:
  caddy_data:
  caddy_config:
